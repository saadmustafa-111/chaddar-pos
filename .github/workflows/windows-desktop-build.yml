name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.17.1'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build API
        run: pnpm --filter api build

      - name: Build Web
        run: pnpm --filter web build

      - name: Build Desktop
        run: pnpm --filter desktop build

      - name: Rebuild native modules for Electron
        run: pnpm --filter desktop exec npx --yes electron-builder install-app-deps

      - name: Electron Builder
        run: pnpm --filter desktop dist --win nsis --x64
        timeout-minutes: 90

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SteelChaddar-POS-Windows
          path: apps/desktop/release
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: SteelChaddar-POS-Windows
          path: artifact

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/SteelChaddar POS Setup*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
