name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.17.1'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build API
        run: pnpm --filter api build

      - name: Deploy API production bundle
        run: pnpm --filter api deploy --legacy --ignore-scripts --prod apps/api/deploy

      - name: Copy API build output to deploy
        shell: pwsh
        run: Copy-Item -Path apps/api/dist -Destination apps/api/deploy/dist -Recurse -Force

      - name: Build Web
        run: pnpm --filter web build

      - name: Build Desktop
        run: pnpm --filter desktop build

      - name: Rebuild native modules for Electron
        run: pnpm --filter desktop exec npx --yes electron-builder install-app-deps

      - name: Electron Builder
        run: pnpm --filter desktop dist --win nsis --x64
        timeout-minutes: 90

      - name: Verify installer was created
        shell: pwsh
        run: |
          $desktopRelease = Join-Path $env:GITHUB_WORKSPACE "apps\desktop\release"
          $exeFiles = Get-ChildItem $desktopRelease -Filter "*.exe" -Recurse -File
          if ($exeFiles.Count -eq 0) { throw "No .exe files found in apps/desktop/release" }
          $nsisInstaller = $exeFiles | Where-Object { $_.Name -match "SteelChaddar.*Setup.*\.exe$" -or $_.Name -match "install.*\.exe$" }
          if ($nsisInstaller) {
            Write-Host "NSIS installer verified: $($nsisInstaller.Name)"
          } else {
            throw "NSIS installer not found. Available .exe files: $($exeFiles.Name -join ', ')"
          }

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SteelChaddar-POS-Windows
          path: apps/desktop/release
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: SteelChaddar-POS-Windows
          path: artifact

      - name: Find and verify NSIS installer
        shell: bash
        run: |
          echo "=== Release directory contents ==="
          find artifact -type f -name "*.exe" 2>/dev/null || echo "No .exe files found"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/**/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
