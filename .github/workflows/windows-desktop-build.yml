name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.17.1'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build API
        run: pnpm --filter api build

      - name: Deploy API production bundle
        shell: pwsh
        run: |
          ./scripts/deploy-api.ps1 -SourceApiPath "apps/api" -DeployPath "apps/api/deploy"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild native modules in deployed API for Electron
        shell: pwsh
        run: |
          $apiDeployPath = Join-Path $env:GITHUB_WORKSPACE "apps\api\deploy"
          $electronVersion = (Get-Content "$env:GITHUB_WORKSPACE\apps\desktop\node_modules\electron\package.json" -ErrorAction SilentlyContinue | ConvertFrom-Json | Select-Object -ExpandProperty version)
          if (-not $electronVersion) {
            $electronVersion = "33.2.1"
          }
          $env:GYP_MSVS_VERSION = "2022"
          $env:pythonPath = (Get-Command python -ErrorAction SilentlyContinue).Source
          Write-Host "=== Diagnostic Info ==="
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "GYP_MSVS_VERSION=$env:GYP_MSVS_VERSION"
          Write-Host "Python: $env:pythonPath"
          Write-Host ""
          Write-Host "=== Installed Visual Studio instances ==="
          Get-ChildItem "C:\Program Files (x86)\Microsoft Visual Studio" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
          Write-Host ""
          $vs2022Path = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $vs2022Exists = Test-Path $vs2022Path
          Write-Host "VS2022 Enterprise exists at $vs2022Path : $vs2022Exists"
          Write-Host ""
          $bs3Path = Join-Path $apiDeployPath "node_modules\better-sqlite3"
          $bs3Native = Join-Path $bs3Path "build\Release\better_sqlite3.node"
          $bs3Prebuild = Join-Path $bs3Path "prebuilds\win32-x64.node"

          Write-Host "=== Pre-rebuild binary info ==="
          if (Test-Path $bs3Native) {
            $fi = Get-Item $bs3Native
            Write-Host "  native binary: $($fi.Length) bytes, $($fi.LastWriteTime)"
          }
          if (Test-Path $bs3Prebuild) {
            $fi = Get-Item $bs3Prebuild
            Write-Host "  prebuild:      $($fi.Length) bytes, $($fi.LastWriteTime)"
          }

          Write-Host ""
          Write-Host "=== Deleting existing prebuilt binaries to force source rebuild ==="
          Remove-Item -LiteralPath $bs3Native -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $bs3Prebuild -Force -ErrorAction SilentlyContinue
          $prebuildCache = Join-Path $bs3Path ".prebundle"
          Remove-Item -LiteralPath $prebuildCache -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Deleted. Remaining files in build/Release:"
          Get-ChildItem (Join-Path $bs3Path "build\Release") -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }

          Write-Host ""
          Write-Host "=== Rebuilding better-sqlite3 from SOURCE for Electron $electronVersion ==="
          Push-Location $apiDeployPath
          try {
            npx --yes @electron/rebuild --build-from-source -f -w better-sqlite3 -v $electronVersion -m . 2>&1 | ForEach-Object { Write-Host "  $_" }
          } finally {
            Pop-Location
          }

          Write-Host ""
          Write-Host "=== Post-rebuild binary info ==="
          if (Test-Path $bs3Native) {
            $fi = Get-Item $bs3Native
            Write-Host "  native binary: $($fi.Length) bytes, $($fi.LastWriteTime)"
            Write-Host "  ABI check via node:"
            Push-Location $apiDeployPath
            node -e "try{const m=require('./node_modules/better-sqlite3'); console.log('  version:', require('./node_modules/better-sqlite3/package.json').version); const db=new m.Database(':memory:'); console.log('  in-memory DB OK'); db.close();}catch(e){console.log('  ERROR:', e.message.split('\n')[0])}"
            Pop-Location
          } else {
            Write-Host "  FATAL: native binary NOT FOUND after rebuild!"
          }

      - name: Build Web
        shell: pwsh
        run: |
          $env:NEXT_PUBLIC_API_URL = "http://127.0.0.1:4555/api/v1"
          Write-Host "NEXT_PUBLIC_API_URL set to: $env:NEXT_PUBLIC_API_URL"
          pnpm --filter web build

      - name: Build Desktop
        run: pnpm --filter desktop build

      - name: Rebuild native modules for Electron
        run: pnpm --filter desktop exec npx --yes electron-builder install-app-deps

      - name: Verify staged production API
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apiDeployPath = Join-Path $env:GITHUB_WORKSPACE "apps\api\deploy"
          $apiMainJs = Join-Path $apiDeployPath "dist\main.js"
          $nodeModules = Join-Path $apiDeployPath "node_modules"

          Write-Host "=== Verifying Staged Production API ==="

          if (-not (Test-Path $apiMainJs)) {
            throw "MISSING: API main.js not found at $apiMainJs"
          }
          Write-Host "[OK] API main.js exists"

          if (-not (Test-Path (Join-Path $nodeModules "@nestjs\core"))) {
            throw "MISSING: @nestjs/core not found"
          }
          Write-Host "[OK] @nestjs/core exists"

          if (-not (Test-Path (Join-Path $nodeModules "better-sqlite3"))) {
            throw "MISSING: better-sqlite3 not found"
          }
          Write-Host "[OK] better-sqlite3 exists"

          $betterSqlite3Lib = Join-Path $nodeModules "better-sqlite3\lib"
          if (-not (Test-Path $betterSqlite3Lib)) {
            throw "MISSING: better-sqlite3 lib folder"
          }
          Write-Host "[OK] better-sqlite3 lib exists"

          $bindings = Join-Path $nodeModules "better-sqlite3\build\Release"
          if (-not (Test-Path $bindings)) {
            $bindings = Join-Path $nodeModules "better-sqlite3\prebuilds"
          }
          if (-not (Test-Path $bindings)) {
            throw "MISSING: better-sqlite3 native bindings not found"
          }
          Write-Host "[OK] better-sqlite3 native bindings exist"

          Write-Host ""
          Write-Host "Checking for external junctions in deployed node_modules..."
          $externalLinks = Get-ChildItem $nodeModules -Recurse -Depth 3 -ErrorAction SilentlyContinue |
            Where-Object { $_.LinkType -in @('SymbolicLink', 'Junction') } |
            Where-Object {
              $target = $_.Target
              if ($target -is [System.Object[]]) { $target = $target[0] }
              $target -notlike "*$apiDeployPath*"
            }
          if ($externalLinks) {
            Write-Host "WARNING: Found $($externalLinks.Count) external junctions:"
            $externalLinks | Select-Object -First 5 | ForEach-Object {
              $target = $_.Target
              if ($target -is [System.Object[]]) { $target = $target[0] }
              Write-Host "  $($_.FullName) -> $target"
            }
          } else {
            Write-Host "[OK] No external junctions found"
          }

          Write-Host ""
          Write-Host "=== Staged API Verification PASSED ==="

      - name: Electron Builder
        run: pnpm --filter desktop dist --win nsis --x64
        timeout-minutes: 90

      - name: Verify packaged better-sqlite3 binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $winUnpacked = Join-Path $env:GITHUB_WORKSPACE "apps\desktop\release\win-unpacked"
          $electronExe = Get-ChildItem $winUnpacked -Filter "*.exe" -File | Select-Object -First 1 | Select-Object -ExpandProperty FullName
          $apiBase = Join-Path $winUnpacked "resources\api"
          $bs3Binary = Join-Path $apiBase "node_modules\better-sqlite3\build\Release\better_sqlite3.node"

          Write-Host "=== Verifying packaged better-sqlite3 binary ==="
          if (-not (Test-Path $bs3Binary)) {
            throw "MISSING: $bs3Binary"
          }
          $fi = Get-Item $bs3Binary
          Write-Host "Binary: $($fi.FullName)"
          Write-Host "Size: $($fi.Length) bytes"
          Write-Host "Modified: $($fi.LastWriteTime)"

          Write-Host ""
          Write-Host "=== Loading better-sqlite3 with Electron ==="
          $testScriptPath = Join-Path $apiBase "test_bs3_electron.js"
          $jsCode = "const Database = require('./node_modules/better-sqlite3/lib/index.js'); console.log('Node ABI:', process.versions.modules); console.log('Electron version:', process.versions.electron); console.log('Node version:', process.versions.node); const db = new Database(':memory:'); console.log('In-memory DB opened OK'); const r = db.prepare('SELECT 1 as v').get(); console.log('Query result:', JSON.stringify(r)); db.close(); console.log('SQLite PASS');"
          Set-Content -Path $testScriptPath -Value $jsCode -Encoding UTF8

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $electronExe
          $psi.Arguments = "test_bs3_electron.js"
          $psi.WorkingDirectory = $apiBase
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true
          $psi.EnvironmentVariables['ELECTRON_RUN_AS_NODE'] = '1'

          $proc = [System.Diagnostics.Process]::Start($psi)
          $didExit = $proc.WaitForExit(15000)
          $stdout = ""
          $stderr = ""
          if ($didExit) {
              $stdout = $proc.StandardOutput.ReadToEnd()
              $stderr = $proc.StandardError.ReadToEnd()
          } else {
              $proc.Kill()
              $stdout = "TIMEOUT"
              $stderr = "TIMEOUT"
          }
          Write-Host "ExitCode: $($proc.ExitCode)"
          Write-Host "STDOUT: $stdout"
          if ($stderr) { Write-Host "STDERR: $stderr" }
          if ($proc.ExitCode -ne 0) {
              Remove-Item $testScriptPath -Force -ErrorAction SilentlyContinue
              throw "better-sqlite3 binary check FAILED"
          }
          Remove-Item $testScriptPath -Force -ErrorAction SilentlyContinue
          Write-Host "=== better-sqlite3 binary OK ==="

      - name: API startup diagnostic
        shell: pwsh
        timeout-minutes: 2
        run: |
          $winUnpacked = Join-Path $env:GITHUB_WORKSPACE "apps\desktop\release\win-unpacked"
          $apiBase = Join-Path $winUnpacked "resources\api"
          $userDataPath = "$env:TEMP\chaddar-diag-$PID"
          $dbDir = "$userDataPath\data"
          $dbPath = "$dbDir\steelcoil.db"
          $outFile = "$env:TEMP\chaddar-out-$PID.log"
          $errFile = "$env:TEMP\chaddar-err-$PID.log"
          New-Item -ItemType Directory -Path $dbDir -Force | Out-Null

          $apiMainJs = Join-Path $apiBase "dist\main.js"
          Write-Host "Main JS: $apiMainJs"
          Write-Host "node: $(Get-Command node -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)"
          Write-Host "main.js exists: $(Test-Path $apiMainJs)"
          Write-Host "Better-sqlite3: $(Test-Path (Join-Path $apiBase 'node_modules\better-sqlite3\build\Release\better_sqlite3.node'))"

          Write-Host "=== Testing better-sqlite3 with node ==="
          $bs3Test = @"
try {
  const Database = require('better-sqlite3');
  const db = new Database(':memory:');
  db.exec('CREATE TABLE t (id INTEGER)');
  db.exec("INSERT INTO t VALUES (1), (2)");
  const result = db.prepare('SELECT * FROM t').all();
  console.log('BS3 OK:', JSON.stringify(result));
  db.close();
} catch(e) {
  console.error('BS3 FAIL:', e.message);
  process.exit(1);
}
"@
          $bs3Out = "$env:TEMP\bs3-test-$PID.log"
          $bs3Err = "$env:TEMP\bs3-err-$PID.log"
          $bs3Proc = Start-Process -FilePath "node" -ArgumentList "-e", $bs3Test -WorkingDirectory $apiBase -PassThru `
            -RedirectStandardOutput $bs3Out -RedirectStandardError $bs3Err -NoNewWindow
          $bs3Proc.WaitForExit(10000)
          $bs3Exit = $bs3Proc.ExitCode
          $bs3OutContent = if (Test-Path $bs3Out) { Get-Content $bs3Out -Raw } else { "" }
          $bs3ErrContent = if (Test-Path $bs3Err) { Get-Content $bs3Err -Raw } else { "" }
          Write-Host "bs3 exit: $bs3Exit"
          Write-Host "bs3 stdout: $bs3OutContent"
          Write-Host "bs3 stderr: $bs3ErrContent"
          $bs3Proc.Dispose()
          Remove-Item $bs3Out,$bs3Err -Force -ErrorAction SilentlyContinue

          Write-Host "=== Starting API with trace-warnings ==="
          $apiEnv = @{
            'NODE_ENV'='production'; 'PORT'='4555'; 'DATABASE_PATH'=$dbPath;
            'ATTACHMENTS_DIR'="$dbDir\attachments"; 'UPLOADS_BASE_URL'='http://127.0.0.1:4555/uploads';
            'SESSION_SECRET'="diag-$PID"; 'DESKTOP_MODE'='true';
            'ALLOWED_ORIGIN'='*'; 'INITIAL_ADMIN_PASSWORD'='SteelCoil2026!'
          }
          $apiProc = Start-Process -FilePath "node" -ArgumentList "--trace-warnings",$apiMainJs -WorkingDirectory $apiBase -PassThru `
            -RedirectStandardOutput $outFile -RedirectStandardError $errFile -EnvironmentVariables $apiEnv
          Write-Host "Started PID: $($apiProc.Id)"
          Start-Sleep 20
          $alive = -not $apiProc.HasExited
          $exitCode = if ($apiProc.HasExited) { $apiProc.ExitCode } else { -1 }
          Write-Host "After 20s: alive=$alive exitCode=$exitCode"

          $stdoutAll = if (Test-Path $outFile) { Get-Content $outFile -Raw } else { "" }
          $stderrAll = if (Test-Path $errFile) { Get-Content $errFile -Raw } else { "" }
          Write-Host "=== STDOUT ($($stdoutAll.Length) chars) ==="
          Write-Host $stdoutAll
          Write-Host "=== STDERR ($($stderrAll.Length) chars) ==="
          Write-Host $stderrAll

          if ($alive) {
              try {
                  $resp = Invoke-WebRequest -Uri "http://127.0.0.1:4555/health" -TimeoutSec 5 -UseBasicParsing
                  Write-Host "HTTP OK: $($resp.StatusCode)"
                  Stop-Process $apiProc.Id -Force -ErrorAction SilentlyContinue
                  $apiProc.Dispose()
                  Remove-Item $outFile,$errFile -Force -ErrorAction SilentlyContinue
                  Remove-Item $userDataPath -Recurse -Force -ErrorAction SilentlyContinue
                  Write-Host "=== PASSED ==="
              } catch {
                  Write-Host "HTTP failed: $($_.Exception.Message)"
                  Stop-Process $apiProc.Id -Force -ErrorAction SilentlyContinue
                  $apiProc.Dispose()
                  Remove-Item $outFile,$errFile -Force -ErrorAction SilentlyContinue
                  Remove-Item $userDataPath -Recurse -Force -ErrorAction SilentlyContinue
                  Write-Host "=== FAILED ==="
                  exit 1
              }
          } else {
              Write-Host "Process died early (exit code: $exitCode)"
              $apiProc.Dispose()
              Remove-Item $outFile,$errFile -Force -ErrorAction SilentlyContinue
              Remove-Item $userDataPath -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "=== FAILED ==="
              exit 1
          }

      - name: Runtime smoke test - packaged API and web
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $winUnpacked = Join-Path $env:GITHUB_WORKSPACE "apps\desktop\release\win-unpacked"
          $electronExe = Get-ChildItem $winUnpacked -Filter "*.exe" -File | Select-Object -First 1
          if (-not $electronExe) { throw "No .exe found in $winUnpacked" }
          $electronExe = $electronExe.FullName
          $apiBase = Join-Path $winUnpacked "resources\api"
          $webBase = Join-Path $winUnpacked "resources\web"

          $apiPort = 4555
          $webPort = 3555
          $apiUrl = "http://127.0.0.1:$apiPort"
          $webUrl = "http://127.0.0.1:$webPort"
          $apiHealth = "$apiUrl/api/v1/health"

          $userDataPath = "$env:TEMP\chaddar-smoke-$PID"
          $dbDir = "$userDataPath\data"
          $dbPath = "$dbDir\steelcoil.db"
          New-Item -ItemType Directory -Path $dbDir -Force | Out-Null

          $apiProc = $null
          $webProc = $null

          try {
            $apiMainJs = Join-Path $apiBase "dist\main.js"
            Write-Host "Starting packaged API on port $apiPort..."
            Write-Host "Executable: $electronExe"
            Write-Host "Main: $apiMainJs"
            Write-Host "WorkingDirectory: $apiBase"
            Write-Host "PORT: $apiPort"
            Write-Host "NODE_ENV: production"
            Write-Host "ELECTRON_RUN_AS_NODE: 1"

            $apipsi = New-Object System.Diagnostics.ProcessStartInfo
            $apipsi.FileName = $electronExe
            $apipsi.Arguments = $apiMainJs
            $apipsi.WorkingDirectory = $apiBase
            $apipsi.UseShellExecute = $false
            $apipsi.RedirectStandardOutput = $true
            $apipsi.RedirectStandardError = $true
            $apipsi.CreateNoWindow = $true
            $apipsi.EnvironmentVariables['NODE_ENV'] = 'production'
            $apipsi.EnvironmentVariables['ELECTRON_RUN_AS_NODE'] = '1'
            $apipsi.EnvironmentVariables['PORT'] = [string]$apiPort
            $apipsi.EnvironmentVariables['DATABASE_PATH'] = $dbPath
            $apipsi.EnvironmentVariables['ATTACHMENTS_DIR'] = "$dbDir\attachments"
            $apipsi.EnvironmentVariables['UPLOADS_BASE_URL'] = "$apiUrl/uploads"
            $apipsi.EnvironmentVariables['SESSION_SECRET'] = "smoke-test-$PID"
            $apipsi.EnvironmentVariables['DESKTOP_MODE'] = 'true'
            $apipsi.EnvironmentVariables['ALLOWED_ORIGIN'] = '*'
            $apipsi.EnvironmentVariables['INITIAL_ADMIN_PASSWORD'] = 'SteelCoil2026!'
            $apiProc = [System.Diagnostics.Process]::Start($apipsi)

            Write-Host "=== Quick TypeORM file-DB test ==="
            $quickTestPath = Join-Path $apiBase "quick_test.js"
            $quickCode = "const { DataSource } = require('typeorm'); const ds = new DataSource({type:'better-sqlite3',database:'$dbPath',synchronize:false,migrationsRun:false}); ds.initialize().then(()=>{console.log('DB INIT OK');return ds.query('SELECT 1')}).then(r=>{console.log('DB QUERY OK:',JSON.stringify(r));ds.destroy().then(()=>process.exit(0))}).catch(e=>{console.error('DB ERROR:',e.message);process.exit(1)});"
            Set-Content -Path $quickTestPath -Value $quickCode -Encoding UTF8
            $qtPsi = New-Object System.Diagnostics.ProcessStartInfo
            $qtPsi.FileName = $electronExe
            $qtPsi.Arguments = "quick_test.js"
            $qtPsi.WorkingDirectory = $apiBase
            $qtPsi.UseShellExecute = $false
            $qtPsi.RedirectStandardOutput = $true
            $qtPsi.RedirectStandardError = $true
            $qtPsi.CreateNoWindow = $true
            $qtPsi.EnvironmentVariables['NODE_ENV'] = 'production'
            $qtPsi.EnvironmentVariables['ELECTRON_RUN_AS_NODE'] = '1'
            $qtPsi.EnvironmentVariables['DATABASE_PATH'] = $dbPath
            $qtProc = [System.Diagnostics.Process]::Start($qtPsi)
            $qtExited = $qtProc.WaitForExit(15000)
            $qtOut = ""
            $qtErr = ""
            if ($qtExited) {
                $qtOut = $qtProc.StandardOutput.ReadToEnd()
                $qtErr = $qtProc.StandardError.ReadToEnd()
            } else {
                $qtProc.Kill()
                $qtOut = "TIMEOUT"
                $qtErr = "TIMEOUT"
            }
            Write-Host "Quick DB test exit code: $($qtProc.ExitCode)"
            Write-Host "Quick DB test stdout: $qtOut"
            if ($qtErr) { Write-Host "Quick DB test stderr: $qtErr" }
            Remove-Item $quickTestPath -Force -ErrorAction SilentlyContinue
            if ($qtProc.ExitCode -ne 0 -and $qtProc.ExitCode -ne $null) {
                Write-Host "FATAL: TypeORM cannot initialize database. Skipping full smoke test."
            }

            Write-Host "Waiting for API health at $apiHealth ..."
            $apiReady = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep 1
              if ($apiProc.HasExited) {
                $stdout = ""
                $stderr = ""
                try { $stdout = $apiProc.StandardOutput.ReadToEnd() } catch {}
                try { $stderr = $apiProc.StandardError.ReadToEnd() } catch {}
                Write-Host "=== PACKAGED API FAILURE ==="
                Write-Host "Executable: $electronExe"
                Write-Host "Main: $apiMainJs"
                Write-Host "WorkingDirectory: $apiBase"
                Write-Host "PORT: $apiPort"
                Write-Host "NODE_ENV: production"
                Write-Host "ELECTRON_RUN_AS_NODE: 1"
                Write-Host "ExitCode: $($apiProc.ExitCode)"
                Write-Host "=== STDOUT ==="
                Write-Host $stdout
                Write-Host "=== STDERR ==="
                Write-Host $stderr
                Write-Host "=============================="
                throw "API process exited early with code $($apiProc.ExitCode)"
              }
              try {
                $resp = Invoke-WebRequest -Uri $apiHealth -TimeoutSec 2 -UseBasicParsing -ErrorAction SilentlyContinue
                if ($resp.StatusCode -eq 200 -or $resp.StatusCode -eq 201) {
                  $apiReady = $true
                  Write-Host "API health OK (attempt $($i+1))"
                  break
                }
              } catch {}
            }
            if (-not $apiReady) { throw "API did not respond at $apiHealth after 60s" }

            $webServerJs = Join-Path $webBase ".next\standalone\apps\web\server.js"
            $webWorkDir = Join-Path $webBase ".next\standalone\apps\web"
            Write-Host "Starting packaged Next.js web on port $webPort..."
            Write-Host "Executable: $electronExe"
            Write-Host "Main: $webServerJs"
            Write-Host "WorkingDirectory: $webWorkDir"
            Write-Host "PORT: $webPort"
            Write-Host "NODE_ENV: production"
            Write-Host "ELECTRON_RUN_AS_NODE: 1"

            $webpsi = New-Object System.Diagnostics.ProcessStartInfo
            $webpsi.FileName = $electronExe
            $webpsi.Arguments = $webServerJs
            $webpsi.WorkingDirectory = $webWorkDir
            $webpsi.UseShellExecute = $false
            $webpsi.RedirectStandardOutput = $true
            $webpsi.RedirectStandardError = $true
            $webpsi.CreateNoWindow = $true
            $webpsi.EnvironmentVariables['NODE_ENV'] = 'production'
            $webpsi.EnvironmentVariables['ELECTRON_RUN_AS_NODE'] = '1'
            $webpsi.EnvironmentVariables['PORT'] = [string]$webPort
            $webpsi.EnvironmentVariables['NEXT_PUBLIC_API_URL'] = $apiUrl
            $webProc = [System.Diagnostics.Process]::Start($webpsi)

            Write-Host "Waiting for web HTTP 200 at $webUrl ..."
            $webReady = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep 1
              if ($webProc.HasExited) {
                $stdout = ""
                $stderr = ""
                try { $stdout = $webProc.StandardOutput.ReadToEnd() } catch {}
                try { $stderr = $webProc.StandardError.ReadToEnd() } catch {}
                Write-Host "=== PACKAGED WEB FAILURE ==="
                Write-Host "Executable: $electronExe"
                Write-Host "Main: $webServerJs"
                Write-Host "WorkingDirectory: $webWorkDir"
                Write-Host "PORT: $webPort"
                Write-Host "NODE_ENV: production"
                Write-Host "ELECTRON_RUN_AS_NODE: 1"
                Write-Host "ExitCode: $($webProc.ExitCode)"
                Write-Host "=== STDOUT ==="
                Write-Host $stdout
                Write-Host "=== STDERR ==="
                Write-Host $stderr
                Write-Host "=============================="
                throw "Web process exited early with code $($webProc.ExitCode)"
              }
              try {
                $resp = Invoke-WebRequest -Uri $webUrl -TimeoutSec 2 -UseBasicParsing -ErrorAction SilentlyContinue
                if ($resp.StatusCode -eq 200) {
                  $webReady = $true
                  Write-Host "Web HTTP 200 OK (attempt $($i+1))"
                  break
                }
              } catch {}
            }
            if (-not $webReady) { throw "Web did not respond at $webUrl after 60s" }

            Write-Host "SMOKE TEST PASSED"
          } finally {
            if ($apiProc -and -not $apiProc.HasExited) { Stop-Process -Id $apiProc.Id -Force -ErrorAction SilentlyContinue }
            if ($webProc -and -not $webProc.HasExited) { Stop-Process -Id $webProc.Id -Force -ErrorAction SilentlyContinue }
            Remove-Item $userDataPath -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Verify installer was created
        shell: pwsh
        run: |
          $desktopRelease = Join-Path $env:GITHUB_WORKSPACE "apps\desktop\release"
          $exeFiles = Get-ChildItem $desktopRelease -Filter "*.exe" -Recurse -File
          if ($exeFiles.Count -eq 0) { throw "No .exe files found in apps/desktop/release" }
          $nsisInstaller = $exeFiles | Where-Object { $_.Name -match "SteelChaddar.*Setup.*\.exe$" -or $_.Name -match "install.*\.exe$" }
          if ($nsisInstaller) {
            Write-Host "NSIS installer verified: $($nsisInstaller.Name)"
          } else {
            throw "NSIS installer not found. Available .exe files: $($exeFiles.Name -join ', ')"
          }

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SteelChaddar-POS-Windows
          path: apps/desktop/release
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: SteelChaddar-POS-Windows
          path: artifact

      - name: Find and verify NSIS installer
        shell: bash
        run: |
          echo "=== Release directory contents ==="
          find artifact -type f -name "*.exe" 2>/dev/null || echo "No .exe files found"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/**/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
