name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.17.1'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build API
        run: pnpm --filter api build

      - name: Build Web
        run: pnpm --filter web build

      - name: Build Desktop
        run: pnpm --filter desktop build

      - name: Verify API build output exists
        run: |
          if (!(Test-Path "apps/api/dist/main.js")) { throw "API dist main.js not found" }
          if (!(Test-Path "apps/api/dist/app.module.js")) { throw "API dist app.module.js not found" }
          if (!(Test-Path "apps/api/dist/modules")) { throw "API dist modules directory not found" }
          Write-Host "API build output verified: PASS"

      - name: Verify API runtime dependencies are resolvable
        working-directory: apps/api
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            "@nestjs/core",
            "@nestjs/common",
            "@nestjs/platform-express",
            "typeorm",
            "better-sqlite3",
            "bcryptjs",
            "reflect-metadata",
            "express-session"
          )
          $failures = @()
          foreach ($pkg in $required) {
            try {
              $resolved = node -e "console.log(require.resolve('$pkg'))"
              Write-Host "Resolved: $pkg -> $resolved"
            } catch {
              Write-Host "FAILED to resolve: $pkg"
              $failures += $pkg
            }
          }
          if ($failures.Count -gt 0) {
            throw "Failed to resolve required packages: $($failures -join ', ')"
          }
          Write-Host "API runtime dependency resolution: PASS"

      - name: Rebuild native modules for Electron
        run: pnpm --filter desktop exec npx --yes electron-builder install-app-deps

      - name: Electron Builder
        run: pnpm --filter desktop dist --win nsis --x64
        timeout-minutes: 90

      - name: Verify win-unpacked resources structure
        shell: pwsh
        run: |
          $winUnpacked = "apps/desktop/release/win-unpacked"
          if (!(Test-Path "$winUnpacked/resources/api/main.js")) { throw "Missing: resources/api/main.js" }
          if (!(Test-Path "$winUnpacked/resources/api/app.module.js")) { throw "Missing: resources/api/app.module.js" }
          if (!(Test-Path "$winUnpacked/resources/api/modules")) { throw "Missing: resources/api/modules" }

          $requiredModules = @(
            "$winUnpacked/resources/api/node_modules/@nestjs/core",
            "$winUnpacked/resources/api/node_modules/@nestjs/common",
            "$winUnpacked/resources/api/node_modules/typeorm",
            "$winUnpacked/resources/api/node_modules/better-sqlite3",
            "$winUnpacked/resources/api/node_modules/bcryptjs"
          )
          foreach ($mod in $requiredModules) {
            if (!(Test-Path $mod)) { throw "Missing module: $mod" }
            Write-Host "Found: $mod"
          }

          Write-Host "win-unpacked resources structure verification: PASS"

      - name: Verify better-sqlite3 prebuilt binding exists
        shell: pwsh
        run: |
          $winUnpacked = "apps/desktop/release/win-unpacked"
          $prebuiltPath = "$winUnpacked/resources/api/node_modules/better-sqlite3/prebuilds/win32-x64.node"

          if (!(Test-Path $prebuiltPath)) {
            throw "MISSING NATIVE BINDING: $prebuiltPath"
          }
          $fileInfo = Get-Item $prebuiltPath
          if ($fileInfo.Length -lt 1000000) {
            throw "Native binding file too small ($($fileInfo.Length) bytes) - likely invalid"
          }
          Write-Host "Found better-sqlite3 prebuilt: $prebuiltPath ($($fileInfo.Length) bytes)"
          Write-Host "better-sqlite3 prebuilt verification: PASS"

      - name: Hard FAIL test - require all critical modules in packaged context
        shell: pwsh
        run: |
          $exePath = (Get-ChildItem "apps/desktop/release/win-unpacked" -Filter "*.exe" -Recurse -File | Where-Object { $_.Name -notmatch "Uninstall" } | Select-Object -First 1).FullName
          $apiPath = "$((Get-Location).Path)/apps/desktop/release/win-unpacked/resources/api"

          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:NODE_ENV = "production"
          $env:PORT = "4444"

          $modules = @(
            "@nestjs/core",
            "@nestjs/common",
            "@nestjs/platform-express",
            "typeorm",
            "better-sqlite3",
            "bcryptjs",
            "reflect-metadata",
            "express-session"
          )

          foreach ($mod in $modules) {
            $testCode = "try { require.resolve('$mod'); console.log('OK') } catch(e) { console.error('FAIL: $mod - ' + e.message); process.exit(1) }"
            $result = & $exePath -e $testCode 2>&1
            if ($LASTEXITCODE -ne 0 -or $result -match "FAIL") {
              throw "FAILED to require '$mod' in packaged context. Output: $result"
            }
            Write-Host "require.resolve('$mod'): OK"
          }
          Write-Host "All critical modules resolvable in packaged context: PASS"

      - name: Hard FAIL test - better-sqlite3 SQLite SELECT 1
        shell: pwsh
        run: |
          $exePath = (Get-ChildItem "apps/desktop/release/win-unpacked" -Filter "*.exe" -Recurse -File | Where-Object { $_.Name -notmatch "Uninstall" } | Select-Object -First 1).FullName
          $apiPath = "$((Get-Location).Path)/apps/desktop/release/win-unpacked/resources/api"

          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:NODE_ENV = "production"

          $testCode = @"
process.chdir('$($apiPath.replace('\', '/')');
try {
  const Database = require('better-sqlite3');
  const db = new Database(':memory:');
  const result = db.prepare('SELECT 1 as value').get();
  db.close();
  if (result.value === 1) {
    console.log('SQLite SELECT 1: OK');
  } else {
    console.error('SQLite SELECT 1: unexpected result', result);
    process.exit(1);
  }
} catch(e) {
  console.error('SQLite test FAILED:', e.message);
  process.exit(1);
}
"@
          $result = & $exePath -e $testCode 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "better-sqlite3 SQLite test FAILED. Exit code: $LASTEXITCODE. Output: $result"
          }
          if ($result -match "FAILED") {
            throw "better-sqlite3 SQLite test reported failure: $result"
          }
          Write-Host "better-sqlite3 SQLite SELECT 1: PASS"

      - name: Hard FAIL test - API bootstrap and health endpoint
        shell: pwsh
        run: |
          $exePath = (Get-ChildItem "apps/desktop/release/win-unpacked" -Filter "*.exe" -Recurse -File | Where-Object { $_.Name -notmatch "Uninstall" } | Select-Object -First 1).FullName
          $apiPath = "$((Get-Location).Path)/apps/desktop/release/win-unpacked/resources/api"
          $apiMain = "$apiPath/main.js"
          $dbPath = "$env:TEMP\steelcoil_test.db"
          $attachPath = "$env:TEMP\steelcoil_test_attachments"

          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:NODE_ENV = "production"
          $env:PORT = "4555"
          $env:DATABASE_PATH = $dbPath
          $env:ATTACHMENTS_DIR = $attachPath
          $env:UPLOADS_BASE_URL = "http://127.0.0.1:4555/uploads"
          $env:SESSION_SECRET = "test-secret"
          $env:DESKTOP_MODE = "true"
          $env:ALLOWED_ORIGIN = "*"
          $env:INITIAL_ADMIN_PASSWORD = "TestPass123!"

          if (!(Test-Path $attachPath)) { New-Item -ItemType Directory -Path $attachPath -Force | Out-Null }

          Write-Host "Starting API: $exePath $apiMain"
          Write-Host "PORT=$env:PORT DATABASE_PATH=$dbPath"

          $proc = Start-Process -FilePath $exePath -ArgumentList $apiMain -EnvironmentVariables $env -PassThru -NoNewWindow -RedirectStandardOutput "$env:TEMP\api_stdout.log" -RedirectStandardError "$env:TEMP\api_stderr.log"

          $healthOk = $false
          $maxWait = 30000
          $interval = 500
          $elapsed = 0

          while ($elapsed -lt $maxWait) {
            Start-Sleep -Milliseconds $interval
            $elapsed += $interval

            if ($proc.HasExited) {
              $exitCode = $proc.ExitCode
              $stderr = Get-Content "$env:TEMP\api_stderr.log" -Raw -ErrorAction SilentlyContinue
              $stdout = Get-Content "$env:TEMP\api_stdout.log" -Raw -ErrorAction SilentlyContinue
              Stop-Process $proc.Id -Force -ErrorAction SilentlyContinue
              throw "API process exited prematurely. Exit code: $exitCode. Stdout: $stdout. Stderr: $stderr"
            }

            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:4555/api/v1/health" -UseBasicParsing -TimeoutSec 2 -ErrorAction SilentlyContinue
              if ($resp.StatusCode -eq 200) {
                $healthOk = $true
                Write-Host "Health endpoint responded: $($resp.StatusCode)"
                break
              }
            } catch {
              Write-Host "Health check attempt $('{0:N0}' -f ($elapsed / 1000))s - still waiting..."
            }
          }

          $stderr = Get-Content "$env:TEMP\api_stderr.log" -Raw -ErrorAction SilentlyContinue
          $stdout = Get-Content "$env:TEMP\api_stdout.log" -Raw -ErrorAction SilentlyContinue

          if (!$healthOk) {
            Stop-Process $proc.Id -Force -ErrorAction SilentlyContinue
            Write-Host "API Stdout: $stdout"
            Write-Host "API Stderr: $stderr"
            throw "API health endpoint did not respond within ${maxWait}ms. Stdout: $stdout. Stderr: $stderr"
          }

          Stop-Process $proc.Id -Force -ErrorAction SilentlyContinue
          Remove-Item $dbPath -ErrorAction SilentlyContinue
          Remove-Item $attachPath -Recurse -ErrorAction SilentlyContinue
          Write-Host "API bootstrap and health endpoint test: PASS"

      - name: Verify NSIS installer was created
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem "apps/desktop/release" -Filter "*.exe" -Recurse -File
          if ($exeFiles.Count -eq 0) { throw "No .exe files found in apps/desktop/release" }
          foreach ($exe in $exeFiles) {
            Write-Host "Found installer: $($exe.FullName) ($($exe.Length / 1MB) MB)"
          }
          $nsisInstaller = $exeFiles | Where-Object { $_.Name -match "SteelChaddar.*Setup.*\.exe$" -or $_.Name -match "install.*\.exe$" }
          if ($nsisInstaller) {
            Write-Host "NSIS installer verified: $($nsisInstaller.Name)"
          } else {
            Write-Host "WARNING: Could not identify NSIS installer. All .exe files:"
            $exeFiles | ForEach-Object { Write-Host "  $($_.Name)" }
          }
          Write-Host "Installer verification: PASS"

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SteelChaddar-POS-Windows
          path: apps/desktop/release
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: SteelChaddar-POS-Windows
          path: artifact

      - name: Find and verify NSIS installer
        shell: bash
        run: |
          echo "=== Release directory contents ==="
          find artifact -type f -name "*.exe" 2>/dev/null || echo "No .exe files found"
          echo ""
          echo "=== All files in artifact ==="
          find artifact -type f 2>/dev/null | head -50

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/**/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
